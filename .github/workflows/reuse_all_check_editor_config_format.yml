name: Editor Config format check

permissions: { }

on:
  workflow_call:
    secrets:
      envGH:
        required: true

jobs:
  validate:
    name: Validate Editor Config formatting
    runs-on: 'ubuntu-latest'

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
    - name: Checkout PR head branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Editor Config Validation against PR base commit
      uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
      env:
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_EDITORCONFIG: true
        DEFAULT_BRANCH: ${{ github.event.pull_request.base.sha }}
        GITHUB_TOKEN: ${{ secrets.envGH }}
        VALIDATE_MARKDOWN: true
