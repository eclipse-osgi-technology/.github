# Central reusable CodeQL workflow for the Java repos of
# eclipse-osgi-technology, called from each repo's codeql.yml stub. It
# analyzes the Java code and the GitHub workflows of the repo, as the
# default setup it replaces did.
# build-mode none needs no working Maven build. The action versions live
# only here, pinned by commit SHA and kept current by Dependabot on this
# repo (one grouped PR, so init and analyze never drift apart).
name: codeql

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ java, actions ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"
