# Central reusable OSSF Scorecard workflow for the repos of
# eclipse-osgi-technology, called from each repo's scorecard-analysis.yml
# stub. The Scorecard API verifies THIS file (the job_workflow_ref of the
# signing certificate), so it must follow the scorecard-action workflow
# restrictions: no top-level env or defaults, no workflow-level write
# permissions, id-token: write only on this job, an Ubuntu hosted runner,
# and only the approved actions as steps.
# No top-level permissions: a called workflow may not request more than the
# caller's job grants, and the stub grants exactly the two scopes below.
name: scorecard

on:
  workflow_call:

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
